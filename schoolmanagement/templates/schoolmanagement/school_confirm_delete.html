{% extends "base.html" %}
{% block title %}Elimina Scuola{% endblock %}
{% block content %}
    <h1>Conferma eliminazione</h1>
    <p>Sei sicuro di voler eliminare la scuola <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Elimina</button>
        <a href="{% url 'lista_scuole' %}" class="btn btn-secondary">Annulla</a>
    </form>
{% endblock %}
