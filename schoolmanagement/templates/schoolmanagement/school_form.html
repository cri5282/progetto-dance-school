{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Modifica{% else %}Nuova{% endif %} Scuola{% endblock %}
{% block content %}
    <h1>{% if object %}Modifica scuola{% else %}Aggiungi nuova scuola{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {% crispy form %}
        <button type="submit" class="btn btn-success">Salva</button>
        <a href="{% url 'lista_scuole' %}" class="btn btn-secondary">Annulla</a>
    </form>
{% endblock %}
