{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Modifica{% else %}Nuovo{% endif %} Corso{% endblock %}
{% block content %}
    <h1>{% if object %}Modifica corso{% else %}Inserisci nuovo corso{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {% crispy form %}
        <button type="submit" class="btn btn-success">Salva</button>
        <a href="{% url 'course_list' %}" class="btn btn-secondary">Annulla</a>
    </form>
{% endblock %}
